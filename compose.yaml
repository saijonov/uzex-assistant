services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/registry.duckdb
      STATE_PATH: /app/var/state.sqlite3
    volumes:
      - ./data:/app/data:ro
      - ./var:/app/var
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    stop_grace_period: 15s
