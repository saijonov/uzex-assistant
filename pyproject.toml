[project]
name = "uzex-assistant"
version = "0.1.0"
description = "Evidence-based Uzbek and Russian exchange registry assistant"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiogram>=3.22,<4",
  "duckdb>=1.4,<2",
  "openai>=2,<3",
  "pydantic-settings>=2.10,<3",
  "rapidfuzz>=3.14,<4",
  "sqlglot>=27,<31",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.14,<1"]

[project.scripts]
uzex = "uzex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uzex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

